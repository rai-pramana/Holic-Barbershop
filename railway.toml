[build]
builder = "nixpacks"

[deploy]
startCommand = "mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs && php artisan migrate --force && php artisan db:seed --force && php artisan optimize:clear && sh -c 'php artisan storage:link --force || true' && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=$PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
